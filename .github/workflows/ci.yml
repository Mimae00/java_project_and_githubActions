# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-java:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2

    - name: Set up JDK 1.8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Build and Push App Docker Image
      uses: mr-smithers-excellent/docker-build-push@v7
      with:
        image: michael220701/demo-app-github-actions
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        tags: latest

    - name: Build and Push Nginx Docker Image
      uses: mr-smithers-excellent/docker-build-push@v7
      with:
        image: michael220701/my-nginx
        dockerfile: Dockerfile.nginx
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        tags: latest

    - name: Smoke test with docker-compose
      run: |
        docker-compose up -d
        sleep 15
        curl --fail http://localhost/actuator/health || (docker-compose logs && exit 1)
        docker-compose down